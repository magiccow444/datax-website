# cPanel deployment config. The GitHub Action copies this file to the root of
# the cpanel-deploy branch; cPanel runs these tasks when you click
# "Deploy HEAD Commit" in Git Version Control.
#
# The built site lives in site/ on that branch, so copying "site/." picks up
# hidden files like .htaccess without also copying .git.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/datax/public_html/
    - /bin/cp -R site/. $DEPLOYPATH
